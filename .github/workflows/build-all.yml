name: Multi-Platform Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Fresh Android Wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.baristastudio --project-name=barista_studio

      - name: Inject BLE Permissions, Custom Icons & App Label
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMS='    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          sed -i "/<manifest/a $PERMS" "$MANIFEST"
          sed -i 's/android:label="barista_studio"/android:label="Barista Studio"/g' "$MANIFEST"
          cp -r assets/android_res/mipmap-* android/app/src/main/res/

      - name: Get Dependencies & Upgrade Plugin compileSdk to 36
        run: |
          flutter pub get
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/compileSdkVersion 3[0-5]/compileSdkVersion 36/g; s/compileSdk 3[0-5]/compileSdk 36/g' {} +

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: barista-studio-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    name: Build macOS Desktop (.zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Fresh macOS Runner & Inject BLE Entitlements
        run: |
          rm -rf macos
          flutter create . --platforms=macos --org com.baristastudio --project-name=barista_studio
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Barista Studio uses Bluetooth to connect and flash recipes to your Nespresso Barista.'" macos/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.device.bluetooth bool true" macos/Runner/DebugProfile.entitlements
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.device.bluetooth bool true" macos/Runner/Release.entitlements

      - name: Get Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Compress App Bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r barista-studio-macos.zip barista_studio.app

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: barista-studio-macos
          path: build/macos/Build/Products/Release/barista-studio-macos.zip

  build-linux:
    name: Build Linux Desktop (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Fresh Linux Runner
        run: |
          rm -rf linux
          flutter create . --platforms=linux --org com.baristastudio --project-name=barista_studio

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Bundle
        run: flutter build linux --release

      - name: Package Linux Binary
        run: |
          tar -czvf barista-studio-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux App
        uses: actions/upload-artifact@v4
        with:
          name: barista-studio-linux-x64
          path: barista-studio-linux-x64.tar.gz

  build-windows:
    name: Build Windows Desktop (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Fresh Windows Runner & Silence MSVC Coroutine Warning
        shell: pwsh
        run: |
          flutter create . --platforms=windows --org com.baristastudio --project-name=barista_studio
          $cmake = Get-Content windows\CMakeLists.txt -Raw
          $fix = "project(barista_studio LANGUAGES CXX)`nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
          $cmake = $cmake -replace 'project\(barista_studio LANGUAGES CXX\)', $fix
          Set-Content windows\CMakeLists.txt -Value $cmake

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Windows Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath barista-studio-windows-x64.zip

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: barista-studio-windows-x64
          path: barista-studio-windows-x64.zip
